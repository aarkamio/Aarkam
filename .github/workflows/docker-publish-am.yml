name: Publish AM CLI Docker Image

on:
  release:
    types: [published]
  push:
    paths:
      - 'Releases/Am-Cli/**'
      - 'Dockerfile.am.release'
      - '.github/workflows/docker-publish-am.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image Version Tag (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build-and-push:
    name: Build & Push AM CLI Docker Image
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'am') ||
      contains(github.event.release.name, 'AM') ||
      contains(github.event.release.name, 'CLI')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage Release Payload
        run: |
          mkdir -p dist/linux
          unzip -o Releases/Am-Cli/V-1.0.1/am-v1.0.1-linux-x64.zip -d dist/linux/
          chmod +x dist/linux/am dist/linux/install-am.sh 2>/dev/null || true
          ls -la dist/linux/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.am.release
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.am:v1.0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.am:1.0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.am:latest

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: aarkam/aarkam.am
          readme-filepath: Releases/Am-Cli/V-1.0.1/DOCKER_README.md
