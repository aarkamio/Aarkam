name: Publish Rokka Docker Image

on:
  release:
    types: [published]
  push:
    paths:
      - 'Releases/Rokka/**'
      - 'Dockerfile.rokka.release'
      - '.github/workflows/docker-publish-rokka.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image Version Tag (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build-and-push:
    name: Build & Push Rokka Docker Image
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'rokka') ||
      contains(github.event.release.name, 'Rokka') ||
      github.event.release.tag_name == 'v1.0.1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage Release Payload
        run: |
          mkdir -p dist/linux
          unzip -o Releases/Rokka/V-1.0.1/rokka-v1.0.1-linux-x64.zip -d dist/linux/
          chmod +x dist/linux/rokka-coordinator dist/linux/rokka-gateway dist/linux/install-rokka.sh dist/linux/entrypoint.sh 2>/dev/null || true
          ls -la dist/linux/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rokka.release
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.rokka:v1.0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.rokka:1.0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.rokka:latest

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: aarkam/aarkam.rokka
          readme-filepath: Releases/Rokka/V-1.0.1/DOCKER_README.md
